name: Depoyu canlı tut

# GitHub, 60 gün boyunca hiç commit olmayan herkese açık depolarda
# zamanlanmış görevleri durdurur. Bu iş her ayın 1'inde küçük bir commit
# atarak bildirim motorunun kendiliğinden kapanmasını önler.

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .canli-tut
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .canli-tut
          git commit -m "Aylık canlı tutma" || echo "Değişiklik yok"
          git push
